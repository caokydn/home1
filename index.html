```html
<script>

const USERNAME = "caokydn";

async function loadRepos(){

    const container = document.getElementById("content");

    try{

        // Đọc dữ liệu từ games.json cùng thư mục
        const response = await fetch(
            `./games.json?t=${Date.now()}`
        );

        if(!response.ok){
            throw new Error(
                `Cannot load games.json: HTTP ${response.status}`
            );
        }

        const games = await response.json();

        if(
            !games ||
            typeof games !== "object" ||
            Array.isArray(games)
        ){
            throw new Error("Invalid games.json data");
        }

        container.innerHTML = "";

        // Chuyển dữ liệu JSON thành danh sách repository
        const validRepos = Object.keys(games)
            .filter(repoName =>
                repoName &&
                repoName.toLowerCase() !==
                `${USERNAME}.github.io`.toLowerCase()
            )
            .map(repoName => ({
                name: repoName,
                private: false
            }));

        document.getElementById("repoCount").innerHTML =
            `Total Games: ${validRepos.length}`;

        const level1Groups = {};

        validRepos.forEach(repo => {

            const repoName = repo.name;

            const level1 =
                repoName.substring(0,3).toUpperCase();

            const level2 =
                repoName.slice(0,-1);

            const lastChar =
                repoName.slice(-1);

            if(!level1Groups[level1]){
                level1Groups[level1] = {};
            }

            if(!level1Groups[level1][level2]){
                level1Groups[level1][level2] = [];
            }

            level1Groups[level1][level2].push({
                repo: repoName,
                lastChar: lastChar
            });

        });

        const sortedLevel1 =
            Object.keys(level1Groups).sort();

        sortedLevel1.forEach(level1 => {

            // ===== LEVEL 1 BLOCK =====

            const level1Block =
                document.createElement("div");

            level1Block.className =
                "level1-block";

            const title =
                document.createElement("div");

            title.className =
                "group-title";

            title.innerHTML =
                `${level1}`;

            level1Block.appendChild(title);

            // ===== LEVEL 2 CONTAINER =====

            const level2Container =
                document.createElement("div");

            level2Container.className =
                "level2-container";

            const level2Groups =
                level1Groups[level1];

            const sortedLevel2 =
                Object.keys(level2Groups).sort();

            sortedLevel2.forEach(level2 => {

                const subgroup =
                    document.createElement("div");

                subgroup.className =
                    "subgroup";

                const subgroupTitle =
                    document.createElement("div");

                subgroupTitle.className =
                    "subgroup-title";

                subgroupTitle.innerHTML =
                    level2;

                subgroup.appendChild(subgroupTitle);

                const buttonContainer =
                    document.createElement("div");

                buttonContainer.className =
                    "exercise-buttons";

                level2Groups[level2]
                .sort((a,b)=>
                    a.lastChar.localeCompare(b.lastChar)
                )
                .forEach(item => {

                    const gameUrl =
                        `https://${USERNAME}.github.io/${item.repo}/`;

                    const btn =
                        document.createElement("a");

                    btn.className =
                        "exercise-btn";

                    btn.href =
                        gameUrl;

                    btn.target =
                        "_blank";

                    btn.innerHTML =
                        item.lastChar;

                    buttonContainer.appendChild(btn);

                });

                subgroup.appendChild(buttonContainer);

                level2Container.appendChild(subgroup);

            });

            level1Block.appendChild(level2Container);

            container.appendChild(level1Block);

        });

    }
    catch(error){

        console.error(error);

        document.getElementById("repoCount").innerHTML = "";

        container.innerHTML = `
            <div style="color:red;text-align:center;">
                Error loading games.json.
            </div>
        `;
    }
}

loadRepos();

</script>
